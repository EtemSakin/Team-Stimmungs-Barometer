services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - .:/app
      - dev_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  dev_data:
